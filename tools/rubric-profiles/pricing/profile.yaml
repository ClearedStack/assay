# Rubric profile for the "pricing" category: tools that work out a price,
# a rate or a cost figure from a published rule.
#
# Each table is read top to bottom and the first row whose conditions all
# hold decides. If no row matches, the item is paused with E_NEEDS_SUBTOOL.
# There is no default row anywhere.
profile: pricing
# Version 4: the passing private_by_design row now takes tier_in: [Seen,
# Designed] on emits_tracking and connect_src_self. A tool that is not built
# yet cannot have a Seen privacy fact; Designed is a value fixed by the
# ClearedStack template it will be generated from (strict CSP connect-src
# 'self', offline, no account) and proved after the build by Shakedown. A
# vendor's own claim (Stated) still pauses the item. Every other fact reads
# Seen, Designed or Stated.
version: 4

# Every fact a pricing record must carry. Each fact comes from Sextant in a
# clean-room {value, tier} envelope; no free text can enter Assay. A record
# with a declared fact missing is broken (E_PARSE); a record with an
# undeclared fact or unfamiliar value is paused (E_NEEDS_SUBTOOL).
facts:
  # Where the rule comes from.
  source_kind:
    type: enum
    values: [statute, far, dfars, nist_sp, agency_publication, vendor_document, paywalled_standard, unpublished]
  source_public: {type: bool}
  source_precision:
    type: enum
    values: [exact_formula, lookup_table, defined_procedure, general_principle]

  # How it would run.
  client_runtime:
    type: enum
    values: [browser_js, browser_wasm, desktop_native, server_side]
  needs_backend: {type: bool}
  needs_remote_api: {type: bool}
  largest_input_kb: {type: int, min: 0, max: 10000000}

  # What it would ask of the person using it.
  works_offline: {type: bool}
  needs_account: {type: bool}
  emits_tracking: {type: bool}
  connect_src_self: {type: bool}

  # What it does (closed job vocabulary aligned with Sextant's clean-room rules).
  task_count: {type: int, min: 1, max: 100}
  core_job:
    type: enum
    values: [rate_calculation, amount_calculation, cost_allocation, price_escalation, price_table_lookup, interest_calculation, date_calculation, eligibility_check, record_search, multi_workflow, portal_suite, open_ended_advisory]
  output_kinds:
    type: list
    values: [computed_number, structured_data, citation_lookup, legal_advice, compliance_determination]

  # Evidence for the rubric.
  need_signals: {type: int, min: 0, max: 100000}
  best_alternative:
    type: enum
    values: [none, paid_only, outdated, partial, complete]
  est_source_lines: {type: int, min: 1, max: 1000000}
  worked_examples: {type: int, min: 0, max: 10000}
  reference_updates_per_year: {type: int, min: 0, max: 1000}
  # Pricing only: how many rate tables the tool would have to carry.
  rate_tables: {type: int, min: 0, max: 1000}

  # Tie-breakers.
  roadmap_phase_fit: {type: int, min: 0, max: 3}
  community_demand: {type: int, min: 0, max: 100000}

gates:
  public_source:
    - when: {source_public: {eq: false}}
      pass: false
      reason: "The governing source is not officially released to the public."
    - when: {source_kind: {in: [vendor_document, paywalled_standard, unpublished]}}
      pass: false
      reason: "The governing source is not a statute, a regulation or an official government publication."
    - when:
        source_public: {eq: true}
        source_kind: {in: [statute, far, dfars, nist_sp, agency_publication]}
      pass: true
      reason: "The rules come from officially released public material."

  runs_in_browser:
    - when: {needs_backend: {eq: true}}
      pass: false
      reason: "It needs a backend server."
    - when: {needs_remote_api: {eq: true}}
      pass: false
      reason: "It needs a remote API."
    - when: {client_runtime: {in: [desktop_native, server_side]}}
      pass: false
      reason: "It does not run in the browser."
    - when:
        needs_backend: {eq: false}
        needs_remote_api: {eq: false}
        client_runtime: {in: [browser_js, browser_wasm]}
      pass: true
      reason: "It runs entirely client-side."

  # Passing private_by_design requires Seen or Designed provenance on
  # emits_tracking and connect_src_self, so an unverified vendor claim (Stated)
  # pauses for inspection.
  private_by_design:
    - when: {works_offline: {eq: false}}
      pass: false
      reason: "It does not work offline."
    - when: {needs_account: {eq: true}}
      pass: false
      reason: "It requires an account."
    - when: {emits_tracking: {eq: true}}
      pass: false
      reason: "It emits tracking."
    - when: {connect_src_self: {eq: false}}
      pass: false
      reason: "It cannot run under connect-src 'self'."
    - when:
        works_offline: {eq: true}
        needs_account: {eq: false}
        emits_tracking: {eq: false, tier_in: [Seen, Designed]}
        connect_src_self: {eq: true, tier_in: [Seen, Designed]}
      pass: true
      reason: "It works offline, with no account, no tracking and connect-src 'self'."

  one_job:
    - when: {task_count: {gte: 2}}
      pass: false
      reason: "It does more than one job."
    - when:
        task_count: {eq: 1}
        core_job: {in: [rate_calculation, amount_calculation, cost_allocation, price_escalation, price_table_lookup, interest_calculation, date_calculation, eligibility_check, record_search]}
      pass: true
      reason: "It performs one focused job from the category's closed job vocabulary."
    - when:
        task_count: {eq: 1}
        core_job: {in: [multi_workflow, portal_suite, open_ended_advisory]}
      pass: false
      reason: "Its scope is a multi-step suite or open-ended advisory workflow rather than one job."

  arithmetic_not_advice:
    - when: {output_kinds: {any_in: [legal_advice, compliance_determination]}}
      pass: false
      reason: "It renders advice or a legal conclusion."
    - when: {output_kinds: {all_in: [computed_number, structured_data, citation_lookup]}}
      pass: true
      reason: "It computes numbers, structures data or looks up citations."

factors:
  # Need: distinct public requests or citations showing small-business need.
  need:
    - when: {need_signals: {gte: 30}}
      rating: 5
    - when: {need_signals: {gte: 15, lte: 29}}
      rating: 4
    - when: {need_signals: {gte: 7, lte: 14}}
      rating: 3
    - when: {need_signals: {gte: 2, lte: 6}}
      rating: 2
    - when: {need_signals: {lte: 1}}
      rating: 1

  # Gap: 1 means a complete free tool already exists (link to it).
  gap:
    - when: {best_alternative: {in: [none]}}
      rating: 5
    - when: {best_alternative: {in: [paid_only]}}
      rating: 4
    - when: {best_alternative: {in: [outdated]}}
      rating: 3
    - when: {best_alternative: {in: [partial]}}
      rating: 2
    - when: {best_alternative: {in: [complete]}}
      rating: 1

  # Strength of public source: pricing rules are strongest when a statute
  # or acquisition regulation states the formula outright.
  public_source_strength:
    - when:
        source_kind: {in: [statute, far, dfars]}
        source_precision: {in: [exact_formula]}
      rating: 5
    - when:
        source_kind: {in: [statute, far, dfars]}
        source_precision: {in: [lookup_table]}
      rating: 4
    - when:
        source_kind: {in: [statute, far, dfars]}
        source_precision: {in: [defined_procedure]}
      rating: 3
    - when:
        source_kind: {in: [nist_sp, agency_publication]}
        source_precision: {in: [exact_formula, lookup_table]}
      rating: 3
    - when:
        source_kind: {in: [nist_sp, agency_publication]}
        source_precision: {in: [defined_procedure]}
      rating: 2
    - when:
        source_kind: {in: [statute, far, dfars, nist_sp, agency_publication]}
        source_precision: {in: [general_principle]}
      rating: 1

  # Fits in a browser: largest input size (KiB) parsed client-side.
  browser_fit:
    - when: {largest_input_kb: {lte: 64}}
      rating: 5
    - when: {largest_input_kb: {gte: 65, lte: 512}}
      rating: 4
    - when: {largest_input_kb: {gte: 513, lte: 4096}}
      rating: 3
    - when: {largest_input_kb: {gte: 4097, lte: 16384}}
      rating: 2
    - when: {largest_input_kb: {gte: 16385}}
      rating: 1

  # Small enough to read: estimated lines of source (above 1500 triggers
  # split/merge review when need is 4 or 5).
  readable_size:
    - when: {est_source_lines: {lte: 300}}
      rating: 5
    - when: {est_source_lines: {gte: 301, lte: 750}}
      rating: 4
    - when: {est_source_lines: {gte: 751, lte: 1500}}
      rating: 3
    - when: {est_source_lines: {gte: 1501, lte: 2500}}
      rating: 2
    - when: {est_source_lines: {gte: 2501}}
      rating: 1

  # Can be checked: published worked examples for test-vector verification.
  checkable:
    - when: {worked_examples: {gte: 10}}
      rating: 5
    - when: {worked_examples: {gte: 5, lte: 9}}
      rating: 4
    - when: {worked_examples: {gte: 2, lte: 4}}
      rating: 3
    - when: {worked_examples: {eq: 1}}
      rating: 2
    - when: {worked_examples: {eq: 0}}
      rating: 1

  # Low upkeep: annual/quarterly publication cadence and rate-table count.
  low_upkeep:
    - when: {reference_updates_per_year: {eq: 0}}
      rating: 5
    - when:
        reference_updates_per_year: {eq: 1}
        rate_tables: {lte: 2}
      rating: 4
    - when:
        reference_updates_per_year: {eq: 1}
        rate_tables: {gte: 3}
      rating: 3
    - when:
        reference_updates_per_year: {gte: 2, lte: 4}
        rate_tables: {lte: 2}
      rating: 3
    - when:
        reference_updates_per_year: {gte: 2, lte: 4}
        rate_tables: {gte: 3}
      rating: 2
    - when: {reference_updates_per_year: {gte: 5, lte: 12}}
      rating: 2
    - when: {reference_updates_per_year: {gte: 13}}
      rating: 1
