# Rubric profile for the "cyber" category: tools that score, map or tally
# security requirements from a published control set.
#
# Each table is read top to bottom and the first row whose conditions all
# hold decides. If no row matches, the item is paused with E_NEEDS_SUBTOOL.
# There is no default row anywhere. All thresholds are made up for this
# project.
profile: cyber
version: 1

# Every fact a cyber record must carry. A record with a fact missing is
# broken (E_PARSE); a record with a fact not listed here is unfamiliar
# (E_NEEDS_SUBTOOL).
facts:
  # Where the rule comes from.
  source_kind:
    type: enum
    values: [statute, far, dfars, nist_sp, agency_publication, vendor_document, paywalled_standard, unpublished]
  source_public: {type: bool}
  source_precision:
    type: enum
    values: [exact_formula, lookup_table, defined_procedure, general_principle]

  # How it would run.
  client_runtime:
    type: enum
    values: [browser_js, browser_wasm, desktop_native, server_side]
  needs_backend: {type: bool}
  needs_remote_api: {type: bool}
  largest_input_kb: {type: int, min: 0, max: 10000000}

  # What it would ask of the person using it.
  works_offline: {type: bool}
  needs_account: {type: bool}
  emits_tracking: {type: bool}
  connect_src_self: {type: bool}

  # What it does.
  task_count: {type: int, min: 1, max: 100}
  task_sentence: {type: text, max_length: 200}
  output_kinds:
    type: list
    values: [computed_number, structured_data, citation_lookup, legal_advice, compliance_determination]

  # Evidence for the rubric.
  need_signals: {type: int, min: 0, max: 100000}
  best_alternative:
    type: enum
    values: [none, paid_only, outdated, partial, complete]
  est_source_lines: {type: int, min: 1, max: 1000000}
  worked_examples: {type: int, min: 0, max: 10000}
  reference_updates_per_year: {type: int, min: 0, max: 1000}
  # Cyber only: how many controls or requirements the tool would have to cover.
  control_count: {type: int, min: 1, max: 2000}

  # Tie-breakers.
  roadmap_phase_fit: {type: int, min: 0, max: 3}
  community_demand: {type: int, min: 0, max: 100000}

gates:
  public_source:
    - when: {source_public: {eq: false}}
      pass: false
      reason: "The governing source is not officially released to the public."
    - when: {source_kind: {in: [vendor_document, paywalled_standard, unpublished]}}
      pass: false
      reason: "The governing source is not a statute, a regulation or an official government publication."
    - when:
        source_public: {eq: true}
        source_kind: {in: [statute, far, dfars, nist_sp, agency_publication]}
      pass: true
      reason: "The rules come from officially released public material."

  runs_in_browser:
    - when: {needs_backend: {eq: true}}
      pass: false
      reason: "It needs a backend server."
    - when: {needs_remote_api: {eq: true}}
      pass: false
      reason: "It needs a remote API."
    - when: {client_runtime: {in: [desktop_native, server_side]}}
      pass: false
      reason: "It does not run in the browser."
    - when:
        needs_backend: {eq: false}
        needs_remote_api: {eq: false}
        client_runtime: {in: [browser_js, browser_wasm]}
      pass: true
      reason: "It runs entirely client-side."

  private_by_design:
    - when: {works_offline: {eq: false}}
      pass: false
      reason: "It does not work offline."
    - when: {needs_account: {eq: true}}
      pass: false
      reason: "It requires an account."
    - when: {emits_tracking: {eq: true}}
      pass: false
      reason: "It emits tracking."
    - when: {connect_src_self: {eq: false}}
      pass: false
      reason: "It cannot run under connect-src 'self'."
    - when:
        works_offline: {eq: true}
        needs_account: {eq: false}
        emits_tracking: {eq: false}
        connect_src_self: {eq: true}
      pass: true
      reason: "It works offline, with no account, no tracking and connect-src 'self'."

  # The verb lists are deliberately closed. A sentence that opens with a
  # word on neither list is not judged: the item is paused until someone
  # adds the word to one list or the other.
  one_job:
    - when: {task_count: {gte: 2}}
      pass: false
      reason: "It does more than one job."
    - when:
        task_count: {eq: 1}
        task_sentence:
          first_word_in: [score, map, list, check, tally, compute, count, sort, convert, look]
      pass: true
      reason: "It does one job, stated in one verb-first sentence."
    - when:
        task_count: {eq: 1}
        task_sentence:
          first_word_in: [a, an, the, this, it, tool, helps, lets, allows, provides, is, are, can, will, users, you, we]
      pass: false
      reason: "The job is not stated as an active, verb-first sentence."

  arithmetic_not_advice:
    - when: {output_kinds: {any_in: [legal_advice, compliance_determination]}}
      pass: false
      reason: "It renders advice or a legal conclusion."
    - when: {output_kinds: {all_in: [computed_number, structured_data, citation_lookup]}}
      pass: true
      reason: "It computes numbers, structures data or looks up citations."

factors:
  # Need: count of distinct public signals that small businesses need this.
  need:
    - when: {need_signals: {gte: 50}}
      rating: 5
    - when: {need_signals: {gte: 25, lte: 49}}
      rating: 4
    - when: {need_signals: {gte: 12, lte: 24}}
      rating: 3
    - when: {need_signals: {gte: 4, lte: 11}}
      rating: 2
    - when: {need_signals: {lte: 3}}
      rating: 1

  # Gap: 1 means a complete free tool already exists (link to it).
  gap:
    - when: {best_alternative: {in: [none]}}
      rating: 5
    - when: {best_alternative: {in: [paid_only]}}
      rating: 4
    - when: {best_alternative: {in: [outdated]}}
      rating: 3
    - when: {best_alternative: {in: [partial]}}
      rating: 2
    - when: {best_alternative: {in: [complete]}}
      rating: 1

  # Strength of public source: in this category a NIST special publication
  # carries as much weight as a statute or a DFARS clause.
  public_source_strength:
    - when:
        source_kind: {in: [statute, dfars, nist_sp]}
        source_precision: {in: [exact_formula, lookup_table]}
      rating: 5
    - when:
        source_kind: {in: [far]}
        source_precision: {in: [exact_formula, lookup_table]}
      rating: 4
    - when:
        source_kind: {in: [statute, far, dfars, nist_sp]}
        source_precision: {in: [defined_procedure]}
      rating: 3
    - when:
        source_kind: {in: [agency_publication]}
        source_precision: {in: [exact_formula, lookup_table, defined_procedure]}
      rating: 2
    - when:
        source_kind: {in: [statute, far, dfars, nist_sp, agency_publication]}
        source_precision: {in: [general_principle]}
      rating: 1

  # Fits in a browser: size of the largest input a person would load.
  browser_fit:
    - when: {largest_input_kb: {lte: 50}}
      rating: 5
    - when: {largest_input_kb: {gte: 51, lte: 500}}
      rating: 4
    - when: {largest_input_kb: {gte: 501, lte: 5000}}
      rating: 3
    - when: {largest_input_kb: {gte: 5001, lte: 50000}}
      rating: 2
    - when: {largest_input_kb: {gte: 50001}}
      rating: 1

  # Small enough to read: estimated lines of source, marked down when the
  # control set is long, because every control is a line someone must check.
  readable_size:
    - when:
        est_source_lines: {lte: 500}
        control_count: {lte: 150}
      rating: 5
    - when:
        est_source_lines: {lte: 500}
        control_count: {gte: 151}
      rating: 4
    - when:
        est_source_lines: {gte: 501, lte: 1500}
        control_count: {lte: 150}
      rating: 4
    - when:
        est_source_lines: {gte: 501, lte: 1500}
        control_count: {gte: 151}
      rating: 3
    - when: {est_source_lines: {gte: 1501, lte: 3000}}
      rating: 2
    - when: {est_source_lines: {gte: 3001}}
      rating: 1

  # Can be checked: published worked examples to test the result against.
  checkable:
    - when: {worked_examples: {gte: 12}}
      rating: 5
    - when: {worked_examples: {gte: 6, lte: 11}}
      rating: 4
    - when: {worked_examples: {gte: 3, lte: 5}}
      rating: 3
    - when: {worked_examples: {gte: 1, lte: 2}}
      rating: 2
    - when: {worked_examples: {eq: 0}}
      rating: 1

  # Low upkeep: how often the control set is revised.
  low_upkeep:
    - when: {reference_updates_per_year: {eq: 0}}
      rating: 5
    - when: {reference_updates_per_year: {eq: 1}}
      rating: 4
    - when: {reference_updates_per_year: {gte: 2, lte: 3}}
      rating: 3
    - when: {reference_updates_per_year: {gte: 4, lte: 8}}
      rating: 2
    - when: {reference_updates_per_year: {gte: 9}}
      rating: 1
