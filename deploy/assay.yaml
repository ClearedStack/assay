# Assay in the cs-workers namespace.
#
# The image line is resolved by ko (see .ko.yaml); the result is signed and
# applied by the platform, not from here. The namespace itself belongs to
# the platform and is not created by this file.
#
# Three values below are provisional, because SPEC.md does not give them:
# the Muster address and port, the labels on the Muster pods, and the name
# of the "Standard (Workers)" priority class, which is left out until it is
# known. They are listed in the README under "Not yet done".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assay
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: assay
    app.kubernetes.io/part-of: clearedstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assay
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: assay
    app.kubernetes.io/part-of: clearedstack
    app.kubernetes.io/version: v0.1.0-draft
spec:
  replicas: 1
  # One worker at a time: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: assay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assay
        app.kubernetes.io/part-of: clearedstack
    spec:
      serviceAccountName: assay
      # The token is how Assay proves who it is to Muster. It holds no
      # database credential and is given no other secret.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assay
          image: ko://github.com/ClearedStack/assay/cmd/assay
          args: ["run"]
          env:
            - name: CONTRACT_VERSION
              value: v1
            - name: MUSTER_URL
              value: http://muster.clearedstack.svc.cluster.local
            - name: ASSAY_SPOOL_DIR
              value: /var/spool/cs
            # Tells the Go runtime to collect garbage well before the
            # container's limit is reached.
            - name: GOMEMLIMIT
              value: 24MiB
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
            limits:
              memory: 30Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spool
              mountPath: /var/spool/cs
      volumes:
        # The only writable path. It outlives a container restart, which is
        # what the spool is for. It does not outlive the pod; nothing is lost
        # if it goes, because Muster leases the record again and the same
        # record always scores the same.
        - name: spool
          emptyDir:
            sizeLimit: 16Mi
---
# Default deny, both ways, with one way out: HTTP to Muster. The second
# egress rule lets the pod look up Muster's name; without it the first rule
# cannot be used.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assay
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: assay
    app.kubernetes.io/part-of: clearedstack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: assay
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clearedstack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: muster
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
