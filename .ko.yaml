# Build configuration for ko. Assay is built straight from source into an
# image; there is no Dockerfile.
#
#   KO_DOCKER_REPO=<registry>/assay ko build --platform=linux/arm64 --bare ./cmd/assay
#
# --bare pushes to exactly that name. The digest it prints is what the
# deployer pins with an image override on deploy/.
defaultBaseImage: cgr.dev/chainguard/static:latest

builds:
  - id: assay
    main: ./cmd/assay
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
