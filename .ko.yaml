# Build configuration for ko. Assay is built straight from source into an
# image; there is no Dockerfile.
#
#   KO_DOCKER_REPO=lazarette.clearedstack.svc.cluster.local:5000/assay \
#     ko build --bare --platform=linux/arm64 ./cmd/assay
#
# ko's built-in default base image is a static, shell-less non-root image
# pinned by digest inside ko; nothing is tagged :latest.

builds:
  - id: assay
    main: ./cmd/assay
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
